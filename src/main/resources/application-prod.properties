spring.application.name=juris
server.servlet.context-path=/juris
spring.devtools.restart.enabled=false
spring.h2.console.enabled=false

# ===============================
# DATASOURCE - POSTGRESQL
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/juris
spring.datasource.username=juris_user
spring.datasource.password=juris_password
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===============================
# FLYWAY (RECOMENDADO EM PRODUÇÃO)
# ===============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ===============================
# SWAGGER / OPENAPI
# ===============================
springdoc.api-docs.path=/api-docs

# ===============================
# SEGURANÇA / JWT
# ===============================
api.security.token.value=${JWT_SECRET:secret-key}
# ===============================
# ERROS / LOG
# ===============================
server.error.include-stacktrace=never
logging.level.org.springframework.security=DEBUG

